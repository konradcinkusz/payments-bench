name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore PaymentsBench.sln
      - name: Build
        run: dotnet build PaymentsBench.sln --no-restore --configuration Release
      - name: Test
        env:
          PAYMENTSBENCH_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres
        run: dotnet test PaymentsBench.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx"
      # The solution-wide step above already runs this project; the duplication (about ten seconds)
      # is accepted so that the scenario gate has a name, its own trx and its own line in the log.
      - name: Scenarios
        env:
          PAYMENTSBENCH_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres
        run: dotnet test tests/PaymentsBench.Scenarios --no-build --configuration Release --logger "trx;LogFileName=scenarios.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  lint-docs:
    name: Lint documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install lint tooling
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: markdownlint
        run: npm run lint:md
      - name: Check relative links
        run: npm run lint:links
      - name: Check diagrams
        run: npm run lint:diagrams
      - name: Check papers
        run: npm run lint:papers
      - name: Check the generated site is current
        run: npm run site:check
