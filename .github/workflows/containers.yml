name: Containers

# Builds both service images, runs each and waits for /health. Nothing is pushed from here:
# publishing images is the deploy workflow's job.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/PaymentsBench.Api/Dockerfile
            # The API without a connection string runs in memory (degraded mode). The identity
            # slice makes it refuse to start outside Development unless Auth__Authority is set;
            # this smoke test has no identity provider, so it runs the API as Development to keep
            # passing after that change.
            environment: Development
          - name: partner-simulator
            dockerfile: src/PaymentsBench.PartnerSimulator/Dockerfile
            environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: payments-bench-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Run image
        run: |
          docker run --detach --name svc --publish 8080:8080 \
            --env ASPNETCORE_ENVIRONMENT=${{ matrix.environment }} \
            payments-bench-${{ matrix.name }}:ci
      - name: Wait for /health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8080/health; then
              echo
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::/health did not answer within 60 seconds"
          exit 1
      - name: Container does not run as root
        run: |
          uid="$(docker exec svc id -u)"
          echo "container user id: ${uid}"
          test "${uid}" != "0"
      - name: Container logs
        if: always()
        run: docker logs svc
