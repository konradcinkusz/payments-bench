name: Secret Scan

# The CI half of a two-part control (P5; repo-baseline section 2). The local half is
# scripts/hooks/pre-commit; scripts/scan-secrets.sh mirrors this job on a developer machine.
#
# Why the scanner image is :latest, deliberately against the usual pinning rule: a detection
# ruleset is only worth what its newest rule catches, and a pinned scanner silently stops
# detecting whatever was added upstream last month. The trade (a scanner that can change under
# us) buys detection that does not decay. Everything else in this repository is pinned.
#
# The weekly run exists because rules are added upstream continuously: a commit that was clean
# in March can be a finding in June, and nobody re-scans history on their own initiative.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays 05:30 UTC, before the Dependabot window opens at 06:00.
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          # Load-bearing: a shallow clone scans only the tip, so a secret added and removed
          # in an earlier commit of the same branch would pass while still being in history.
          fetch-depth: 0

      - name: Scan
        run: |
          IMAGE="ghcr.io/gitleaks/gitleaks:latest"

          # gitleaks renamed `detect` to `git` in v8.19. Probe instead of assuming, so a
          # scanner upgrade does not turn this job red for the wrong reason.
          if docker run --rm "$IMAGE" git --help >/dev/null 2>&1; then
            SUB=(git /repo)
          else
            SUB=(detect --source=/repo)
          fi

          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            "$IMAGE" \
            "${SUB[@]}" \
              --config=/repo/.gitleaks.toml \
              --redact \
              --no-banner \
              --verbose \
              --exit-code 1

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "## Secret scan failed"
            echo
            echo "A credential-shaped string was found in this repository's history."
            echo
            echo "**Rotate first.** A pushed commit is disclosed the moment it is pushed, so the"
            echo "order of operations is not negotiable:"
            echo
            echo "1. **Rotate the credential.** Now, before anything else."
            echo "2. Remove it from the source; read it from the environment instead (see \`secrets.env.example\`)."
            echo "3. Only then clean history."
            echo
            echo "Scrubbing without rotating is theatre."
            echo
            echo "If this is a false positive, add a **narrow** allowlist entry to \`.gitleaks.toml\`"
            echo "with a comment saying why. Never allowlist a finding by pasting the real value"
            echo "into a regex."
            echo
            echo "Reproduce locally: \`scripts/scan-secrets.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"
