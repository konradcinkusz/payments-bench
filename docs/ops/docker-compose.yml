# Local Prometheus + Grafana for the provisioned dashboard. Not used by CI or any deployment.
#   docker compose -f docs/ops/docker-compose.yml up
# Grafana http://localhost:3000 (anonymous viewer, local only), Prometheus http://localhost:9090.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./grafana/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/payments-bench.json:/var/lib/grafana/dashboards/payments-bench.json:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
