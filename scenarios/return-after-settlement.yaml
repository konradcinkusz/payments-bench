id: return-after-settlement
class: happy
description: A settled transfer is returned by the receiving bank. The customer gets the funds back, nostro nets to zero, and the settlement day's statement still reconciles (no OnStatementOnly break for a payment returned since).
partner:
  fault: none
steps:
  - initiate:
      idempotencyKey: ret-1
      endToEndId: E2E-RET-1
      amount: 30.00
      currency: EUR
      scheme: sepa
  - submit: E2E-RET-1
  - partnerSettles:
      endToEndId: E2E-RET-1
      valueDate: next-business-day
  - notify:
      notificationId: N-RET-1
      endToEndId: E2E-RET-1
      kind: Settled
  - notify:
      notificationId: N-RET-2
      endToEndId: E2E-RET-1
      kind: Returned
      reasonCode: AC04
  - partnerReturns:
      endToEndId: E2E-RET-1
      reasonCode: AC04
  - reconcile: value-date
expect:
  status: Returned
  ledger:
    customer-funds: 0.00
    pending-outbound: 0.00
    nostro: 0.00
  reconciliation:
    breaks: 0
