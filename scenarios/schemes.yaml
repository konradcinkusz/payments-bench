# Scheme rules as data. A new scheme is a new block here, not a branch in code.
schemes:
  - name: sepa
    currency: EUR
    cutOff: "16:00"
    settlementBusinessDays: 1
  - name: faster-payments
    currency: GBP
    cutOff: "23:59"
    settlementBusinessDays: 0
  - name: swift
    currency: USD
    cutOff: "15:00"
    settlementBusinessDays: 2
