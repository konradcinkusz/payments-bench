# TARGET2 (T2) business calendar, the calendar of the euro RTGS system that SEPA settlement
# rides on in this bench. Dates are data; no Easter algorithm lives in code.
#
# Source: European Central Bank, "T2 closing days". T2 is closed on Saturdays and Sundays and on
# six days a year: 1 January, Good Friday, Easter Monday, 1 May, 25 December and 26 December.
# https://www.ecb.europa.eu/paym/target/t2/html/index.en.html
#
# Easter Sunday 2026 is 5 April (Good Friday 3 April, Easter Monday 6 April);
# Easter Sunday 2027 is 28 March (Good Friday 26 March, Easter Monday 29 March).
# Closing days that fall on a weekend (26 Dec 2026, 1 May 2027, 25 and 26 Dec 2027) are listed
# anyway, so the file says what the source says and does not depend on the weekend rule.
# A date outside the covered range is an error, never a guess.
name: target2
weekendsClosed: true
coveredFrom: 2026-01-01
coveredTo: 2027-12-31
closingDays:
  # 2026
  - 2026-01-01   # Thu, New Year's Day
  - 2026-04-03   # Fri, Good Friday
  - 2026-04-06   # Mon, Easter Monday
  - 2026-05-01   # Fri, Labour Day
  - 2026-12-25   # Fri, Christmas Day
  - 2026-12-26   # Sat, Boxing Day / St Stephen's Day
  # 2027
  - 2027-01-01   # Fri, New Year's Day
  - 2027-03-26   # Fri, Good Friday
  - 2027-03-29   # Mon, Easter Monday
  - 2027-05-01   # Sat, Labour Day
  - 2027-12-25   # Sat, Christmas Day
  - 2027-12-26   # Sun, Boxing Day / St Stephen's Day
